name: Optional air quality checks
on:
  pull_request:
    paths:
      - 'world/air-quality/**'
      - 'world/query-service/**'
      - 'world/site/dist/discovery.js'
      - 'world/site/dist/city-map.js'
      - 'world/site/dist/geo-map.js'
      - 'world/site/dist/air-quality*'
      - 'world/site/dist/app.js'
      - 'world/site/dist/map-bootstrap.js'
      - 'world/site/dist/index.html'
      - '.github/workflows/air-quality-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic data and regression checks
        run: |
          node world/air-quality/check.cjs
          node world/air-quality/range-check.cjs
          node world/air-quality/filter-check.cjs
          node world/query-service/check.mjs
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/comfy-ui" --no-save --package-lock=false playwright@1.58.2 esbuild@0.28.2
      - name: Responsive UI and interaction regression with synthetic fixtures
        run: NODE_PATH="$RUNNER_TEMP/comfy-ui/node_modules" CHROMIUM_PATH=/usr/bin/google-chrome node world/air-quality/browser-check.mjs
      - name: Build current Worker and assets
        run: COMFY_ESBUILD_PATH="$RUNNER_TEMP/comfy-ui/node_modules/esbuild" node world/query-service/build-site.mjs "$RUNNER_TEMP/comfy-build"

      - name: Verify published filter with real data and browser
        run: NODE_PATH="$RUNNER_TEMP/comfy-ui/node_modules" CHROMIUM_PATH=/usr/bin/google-chrome node world/air-quality/published-check.mjs
