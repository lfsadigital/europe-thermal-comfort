name: Daily minima preview audit and fast presets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Daily minimum preview release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all cells and build small default maps remotely
        env:
          GH_TOKEN: ${{ github.token }}
          MINIMUM_RELEASE: ${{ inputs.tag }}
        run: node world/minimum/new-defaults.cjs "$MINIMUM_RELEASE"
